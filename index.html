<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ace Impeachment</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <button id="fullscreen-btn"
            onclick="document.getElementById('gameCanvas').dispatchEvent(new Event('toggle-fullscreen'))">⛶
            Fullscreen</button>
    </div>
    <script>
        // Bridge button click to game class
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            // We can access the instance if we store it, or just use simple DOM fullscreen here
            const container = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });
    </script>
    <script src="game.js"></script>
</body>

</html>
